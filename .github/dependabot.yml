version: 2
updates:
  # n8n/docker-compose.yml's n8n image is deliberately n8nio/n8n (implicit
  # Docker Hub), not n8n's own docker.n8n.io mirror - see the comment on
  # that image line. A custom registries: entry was tried first, but
  # Dependabot's docker-registry schema requires username/password even
  # for anonymous-pull registries, which docker.n8n.io doesn't need.
  - package-ecosystem: "docker-compose"
    directory: "/n8n"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/main"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/bootstrap"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
